[project]
name = "engine"
version = "0.0.0"
description = "Python engine host: catalogue, document, code generation, and rendering through Manim CE."
requires-python = ">=3.12"
dependencies = [
    "manim",
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/engine", "tests"]
explicit_package_bases = true
mypy_path = "src"
